<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لوحة الأدمن — UNIWAY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <!-- حماية الصفحة: لازم المستخدم يكون داخل بحساب نفس الدور -->
    <script src="../js/core/auth.js"></script>
    <script>Auth.requireRole("admin");</script>
  </head>
  <body data-role="admin">
    <div class="app">
      <aside class="side" id="side">
        <a class="brand" href="dashboard.html" style="text-decoration:none"><i><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5zM6 12v5c3 3 9 3 12 0v-5"/></svg></i>UNIWAY</a>
        <nav class="nav" aria-label="القائمة الرئيسية">
        <a href="dashboard.html" class="on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2zM9 22V12h6v10"/></svg>لوحة الأدمن</a>
        <a href="users.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>المستخدمون</a>
        </nav>
        <div style="margin-top:auto;font-size:11px;color:rgba(255,255,255,.6);padding:8px">جامعتك... في طريق واحد</div>
      </aside>
      <div style="min-width:0">
        <header class="top">
          <button class="iconbtn menu" id="menu" aria-label="القائمة"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
          <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4.35-4.35"/></svg><input placeholder="ابحث عن طالب أو مقرر..." aria-label="بحث" /></div>
          <div style="flex:1"></div>
          <button class="iconbtn" aria-label="الإشعارات" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg><span class="dot" id="dot"></span></button>
          <span class="avatar" id="profile-link" aria-hidden="true">أ</span>
          <button class="btn ghost logout" id="logout" type="button" aria-label="تسجيل الخروج"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>خروج</span></button>
        </header>
        <main class="page" id="view">
          <div class="head"><div><h1>لوحة الأدمن</h1><p>نظرة عامة على النظام والمستخدمين</p></div><div style="display:flex;gap:8px"></div></div>
          <div class="grid g4" style="margin-bottom:16px">
            <div class="card"><div class="stat"><div class="ico blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg></div><div><b data-stat="accounts">0</b><small>الحسابات</small></div></div></div>
            <div class="card"><div class="stat"><div class="ico green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg></div><div><b data-stat="students">0</b><small>الطلاب</small></div></div></div>
            <div class="card"><div class="stat"><div class="ico amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg></div><div><b data-stat="courses">0</b><small>المقررات</small></div></div></div>
            <div class="card"><div class="stat"><div class="ico red"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2M9 5a2 2 0 002 2h2a2 2 0 002-2"/></svg></div><div><b data-stat="requests">0</b><small>طلبات الطلاب</small></div></div></div>
          </div>
          <div class="card"><h3>إدارة المستخدمين</h3><p style="color:var(--sub)">عرض الحسابات وصلاحياتها.</p><a class="btn primary" href="users.html">فتح المستخدمين</a></div>
        </main>
      </div>
    </div>

    <script src="../js/core/data.js"></script>
    <script src="../js/core/ui.js"></script>
    <script src="../js/roles/admin/pages.js"></script>
    <script src="../js/core/shell.js"></script>
    <script>
      adminDashboard($("#view"));
    </script>
  </body>
</html>
