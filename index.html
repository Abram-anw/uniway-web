<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>تسجيل الدخول — UNIWAY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="login-page">
      <header class="hero">
        <span class="bubble b1" aria-hidden="true"></span>
        <span class="bubble b2" aria-hidden="true"></span>
        <div class="logo" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5zM6 12v5c3 3 9 3 12 0v-5"/></svg>
        </div>
        <h1>UNIWAY</h1>
        <p>جامعتك... في طريق واحد</p>
      </header>

      <main class="sheet">
        <h2>تسجيل الدخول</h2>
        <p class="lead">أدخل بياناتك وسيتم توجيهك تلقائيًا حسب صلاحية حسابك</p>

        <form id="login-form" novalidate autocomplete="off">
          <div class="fld">
            <label for="code">الكود الجامعي</label>
            <div class="box" id="box-code">
              <svg class="lead-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M14 10h4M14 14h3M8 11.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM5.5 15.5c.4-1.2 1.4-1.8 2.5-1.8s2.1.6 2.5 1.8"/></svg>
              <input id="code" name="code" type="text" inputmode="text" dir="ltr" placeholder="مثال: 20210145" autocapitalize="characters" spellcheck="false" aria-describedby="err-code" />
            </div>
            <div class="err" id="err-code" role="alert"></div>
          </div>

          <div class="fld">
            <label for="password">كلمة المرور</label>
            <div class="box" id="box-password">
              <svg class="lead-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
              <input id="password" name="password" type="password" dir="ltr" placeholder="••••••••" aria-describedby="err-password" />
              <button type="button" class="eye" id="toggle-pw" aria-label="إظهار كلمة المرور" aria-pressed="false">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="err" id="err-password" role="alert"></div>
          </div>

          <div class="row">
            <label class="remember"><input type="checkbox" id="remember" checked /><span class="tick"></span>تذكرني</label>
            <button type="button" class="forgot" id="forgot">نسيت كلمة المرور؟</button>
          </div>

          <div class="alert" id="form-alert" role="alert" hidden></div>
          <button type="submit" class="submit" id="submit">تسجيل الدخول</button>
        </form>

        <section class="hint" aria-label="حسابات تجريبية">
          <h3>حسابات تجريبية</h3>
          <p>اضغط على أي حساب لتعبئة البيانات تلقائيًا، وسيفتح لك صفحة الدور الخاص به.</p>
          <ul>
            <li>
              <div><b>دكتور</b><span dir="ltr">DR1001 · 123456</span></div>
              <button type="button" class="fill" data-code="DR1001" data-password="123456">استخدام</button>
            </li>
            <li>
              <div><b>شؤون الطلاب</b><span dir="ltr">SA2001 · 123456</span></div>
              <button type="button" class="fill" data-code="SA2001" data-password="123456">استخدام</button>
            </li>
            <li>
              <div><b>أدمن</b><span dir="ltr">AD3001 · 123456</span></div>
              <button type="button" class="fill" data-code="AD3001" data-password="123456">استخدام</button>
            </li>
            <li>
              <div><b>طالب</b><span dir="ltr">ST4001 · 123456</span></div>
              <button type="button" class="fill" data-code="ST4001" data-password="123456">استخدام</button>
            </li>
          </ul>
        </section>
      </main>
    </div>

    <script src="js/core/auth.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
