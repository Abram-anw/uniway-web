<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>متطلبات الطلب — UNIWAY</title>
    <meta name="description" content="شاشة متطلبات الطلب (M8): عرض أنواع الطلبات والمستندات المطلوبة لكل نوع من المصدر الموحّد الذي يديره الأدمن" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/core/auth.js"></script>
    <script src="../js/core/settings.js"></script>
    <script>Auth.requireRole("student");</script>
  </head>
  <body data-role="student">
    <div class="app">
      <aside class="side" id="side">
        <a class="brand" href="dashboard.html" style="text-decoration:none"><i><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5zM6 12v5c3 3 9 3 12 0v-5"/></svg></i>UNIWAY</a>
        <nav class="nav" aria-label="القائمة الرئيسية">
          <a href="dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2zM9 22V12h6v10"/></svg>لوحة الطالب</a>
          <a href="requirements.html" class="on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9zM13 2v7h7"/></svg>متطلبات الطلب</a>
        </nav>
        <div style="margin-top:auto;font-size:11px;color:rgba(255,255,255,.6);padding:8px">جامعتك... في طريق واحد</div>
      </aside>
      <div style="min-width:0">
        <header class="top">
          <button class="iconbtn menu" id="menu" aria-label="القائمة"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
          <div style="flex:1"></div>
          <span class="avatar" id="profile-link" aria-hidden="true">أ</span>
          <span class="user-name" id="user-name"></span>
          <button class="btn ghost logout" id="logout" type="button" aria-label="تسجيل الخروج"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>خروج</span></button>
        </header>
        <main class="page" id="view"></main>
      </div>
    </div>

    <script src="../js/core/data.js"></script>
    <script src="../js/core/ui.js"></script>
    <script src="../js/core/requests-config.js"></script>
    <script src="../js/core/shell.js"></script>
    <script>
      // ===== شاشة "متطلبات الطلب" (M8) للطالب — قراءة فقط من المصدر الموحّد =====
      // تقرأ نفس مصدر الحقيقة الذي يديره الأدمن (data/request-types.json يُستخدم كبذرة،
      // ثم تُحفظ التعديلات في localStorage عبر خدمة RequestTypes المشتركة).
      const studentRequirementsPage = (view) => {
        const state = { error: "" };

        const KIND_LABEL = { file: "رفع ملف", text: "نص مكتوب", select: "قائمة اختيار" };

        const render = () => {
          if (state.error) {
            view.innerHTML = pageHead("متطلبات الطلب") +
              `<div class="card">${errorBox("تعذر تحميل متطلبات الطلب", state.error, '<button class="btn primary" id="m8-retry">إعادة المحاولة</button>')}</div>`;
            const retry = $("#m8-retry", view);
            if (retry) retry.onclick = boot;
            return;
          }
          const types = RequestTypes.list();
          if (!types.length) {
            view.innerHTML = pageHead("متطلبات الطلب", "لا توجد أنواع طلبات متاحة حاليًا.") +
              `<div class="card">${empty("لا توجد أنواع طلبات", "سيتم عرض أنواع الطلبات ومتطلباتها هنا عند توفرها.")}</div>`;
            return;
          }
          view.innerHTML = pageHead(
            "متطلبات الطلب",
            "أنواع الطلبات المتاحة لك والمستندات المطلوبة لكل نوع. البيانات مقروءة من المصدر الموحّد نفسه الذي يديره الأدمن.",
            `<button class="btn ghost" id="m8-refresh" type="button">تحديث</button>`
          ) + `<div class="card" id="m8-list"></div>`;
          $("#m8-refresh", view).onclick = boot;
          const host = $("#m8-list", view);
          host.innerHTML = types.map((t) => typeCard(t)).join("");
        };

        const boot = () => {
          state.error = "";
          view.innerHTML = pageHead("متطلبات الطلب") + `<div class="card">${skeleton(5)}</div>`;
          RequestTypes.ready()
            .then(() => { state.error = ""; render(); })
            .catch((e) => { state.error = (e && e.message) || "تعذر قراءة إعدادات الطلبات."; render(); });
        };

        const typeCard = (t) => {
          const reqs = t.requirements || [];
          const mandatoryCount = reqs.filter((r) => r.mandatory === true).length;
          const optionalCount = reqs.length - mandatoryCount;
          return `
            <div class="li" style="padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff">
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
                <div class="ico blue" style="width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:#eef7ff">${icon(t.iconName || "file", 16)}</div>
                <div class="grow"><b>${esc(t.name)}</b><div style="font-size:12px;color:var(--mut)">${esc(t.description || "")}</div></div>
                <div style="display:flex;gap:6px">${badge(`${mandatoryCount} إلزامي`, mandatoryCount ? "red" : "gray")}${badge(`${optionalCount} اختياري`, optionalCount ? "gray" : "gray")}</div>
              </div>
              ${reqs.length
                ? `<div style="display:flex;flex-direction:column;gap:6px">${reqs.map((r, i) => docItem(t, r, i + 1)).join("")}</div>`
                : `<div style="font-size:12px;color:var(--mut);padding:8px 0">لا توجد مستندات مطلوبة لهذا النوع — يمكن إرسال الطلب بدون مستندات.</div>`}
            </div>`;
        };

        const docItem = (t, r, n) => {
          const kindLabel = KIND_LABEL[r.kind] || r.kind;
          const optionsHtml = r.kind === "select" && r.options && r.options.length
            ? `<div style="font-size:11.5px;color:var(--mut);margin-top:4px">الخيارات: ${esc(r.options.join("، "))}</div>`
            : "";
          return `
            <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:#fafafa;border:1px solid var(--line)">
              <b style="min-width:20px;color:var(--mut)">${n}.</b>
              <div style="flex:1;min-width:0">
                <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
                  <b style="font-size:13px">${esc(r.name)}</b>
                  ${badge(r.mandatory === true ? "إلزامي" : "اختياري", r.mandatory === true ? "red" : "gray")}
                  ${badge(kindLabel, "blue")}
                </div>
                ${r.hint ? `<div style="font-size:11.5px;color:var(--mut);margin-top:3px">${esc(r.hint)}</div>` : ""}
                ${optionsHtml}
              </div>
            </div>`;
        };

        boot();
      };

      studentRequirementsPage(document.getElementById("view"));
    </script>
  </body>
</html>
